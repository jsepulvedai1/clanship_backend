<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contraseña Restablecida - ClanShip</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=RymanEco&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #F7F7F5;
            color: #2E3135;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background-color: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
            width: 100%;
            max-width: 440px;
            padding: 50px 30px;
            text-align: center;
            border: 1px solid #E2E8F0;
            position: relative;
            overflow: hidden;
        }
        /* Top light wave decorator */
        .wave-top {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 8px;
            background: linear-gradient(90deg, #0D2B45, #0B6E4F);
        }
        .logo-title {
            font-family: 'RymanEco', serif;
            font-size: 32px;
            font-weight: bold;
            color: #0D2B45;
            margin-bottom: 24px;
        }
        .success-icon {
            width: 80px;
            height: 80px;
            background-color: rgba(11, 110, 79, 0.08);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px auto;
            border: 2px solid rgba(11, 110, 79, 0.15);
        }
        .success-icon svg {
            width: 40px;
            height: 40px;
            fill: #0B6E4F;
        }
        h2 {
            font-size: 20px;
            font-weight: 700;
            color: #0D2B45;
            margin-bottom: 12px;
        }
        .subtitle {
            font-size: 14px;
            color: #64748B;
            line-height: 1.6;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="wave-top"></div>
        <h1 class="logo-title">ClanShip</h1>
        
        <div class="success-icon">
            <svg viewBox="0 0 24 24">
                <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/>
            </svg>
        </div>
        
        <h2>¡Contraseña Cambiada!</h2>
        <p class="subtitle">Tu contraseña ha sido restablecida con éxito. Ya puedes cerrar esta ventana, regresar a la aplicación de ClanShip e iniciar sesión con tu nueva contraseña.</p>
    </div>
</body>
</html>
